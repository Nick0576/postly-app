name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'

      - name: Install dependencies
        run: |
          npm install
          # Fix for Reanimated 4 autolinking bug
          mkdir -p node_modules/react-native-worklets
          cp -r node_modules/react-native-worklets-core/* node_modules/react-native-worklets/ || true

      - name: Prebuild Android
        env:
          EXPO_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
        run: npx expo prebuild --platform android --no-install

      - name: Build Debug APK
        env:
          EXPO_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          NODE_OPTIONS: "--max-old-space-size=6144"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: postly-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
